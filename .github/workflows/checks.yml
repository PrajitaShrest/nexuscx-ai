# Runs on every pull request and every push to main.
# A pull request can only be merged when this passes (turn on branch protection for main).
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Placeholders only, so the build can run. Real keys stay in .env.local and never go in GitHub.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  secrets-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No secret keys or env files committed
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.local)?$'; then echo "An .env file is committed. Remove it."; exit 1; fi
          if git grep -nE 'sb_secret_[A-Za-z0-9]|service_role' -- ':!*.md' ':!.github/*'; then echo "A Supabase secret key is in the code."; exit 1; fi
          echo "No secrets found."
